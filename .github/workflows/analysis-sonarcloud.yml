name: Analysis - SonarCloud

on:
  push:
    branches:
      - main
  pull_request:

env:
  VCPKG_FEATURE_FLAGS: manifests,binarycaching
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_DEFAULT_TRIPLET: x64-linux
  VCPKG_DEFAULT_HOST_TRIPLET: x64-linux
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CC: gcc-12
  CXX: g++-12

jobs:
  sonarcloud:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build ccache pkg-config cmake gcc-12 g++-12 \
            libglew-dev libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libharfbuzz-dev libfribidi-dev libprotobuf-dev protobuf-compiler \
            libphysfs-dev nlohmann-json3-dev libpugixml-dev libfmt-dev \
            libopenal-dev libvorbis-dev libluajit-5.1-dev

      # Cache kompilatora ccache
      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: $HOME/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'vcpkg.json', 'src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # Cache danych analizy SonarCloud
      - name: Cache SonarCloud analysis data
        uses: actions/cache@v4
        with:
          path: $HOME/.cfamily
          key: sonar-cfamily-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'vcpkg.json', 'src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: |
            sonar-cfamily-${{ runner.os }}-

      # Cache paczek SonarCloud
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: $HOME/.sonar/cache
          key: sonar-packages-${{ runner.os }}
          restore-keys: |
            sonar-packages-${{ runner.os }}-

      # Setup vcpkg na stabilnym commicie
      - name: Get vcpkg commit ID
        id: vcpkg-step
        run: |
          vcpkgCommitId=$(grep '.builtin-baseline' vcpkg.json | awk -F: '{print $2}' | tr -d '," ')
          echo "vcpkgGitCommitId=$vcpkgCommitId" >> $GITHUB_OUTPUT
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}
          vcpkgJsonGlob: vcpkg.json
          runVcpkgInstall: true

      # Kompilacja i wygenerowanie compile_commands.json
      - name: Build & Generate compilation database
        run: |
          cmake --preset linux-debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_DEFAULT_TRIPLET }} \
            -DCMAKE_C_COMPILER=${{ env.CC }} -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOTC_ENABLE_TTF=ON -DOTC_ENABLE_HARFBUZZ=ON -DOTC_ENABLE_FRIBIDI=ON \
            -DSPEED_UP_BUILD_UNITY=OFF
          cmake --build --preset linux-debug
          cp build/linux-debug/compile_commands.json .

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=PtakuPL_testyy
            -Dsonar.organization=ptakupl
            -Dsonar.sources=src
            -Dsonar.cfamily.compile-commands=compile_commands.json
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
